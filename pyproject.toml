[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-workcell-sim"
version = "1.0.0"
description = "Robot arm workcell simulator: FK/IK kinematics, motion planning, collision checks and pick-and-place simulation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
robot-arm = "robot_arm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
